[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatflow-automator"
version = "0.1.0"
description = "Browser automation for chat interfaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "ChatFlow Team", email = "team@chatflow.local"}
]
keywords = ["automation", "browser", "chat", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "playwright>=1.40.0",
    "PyQt6>=6.6.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.2.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.8.0",
]

[project.scripts]
chatflow = "chatflow.cli.commands:main"

[project.gui-scripts]
chatflow-gui = "chatflow.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatflow"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
